name: Build Standalone Bundles

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: "python-build-standalone Python version"
        required: false
        default: "3.12"
      architecture:
        description: "Optional python-build-standalone architecture override"
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    name: Build Linux standalone bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.14
        with:
          pixi-version: v0.45.0
          cache: true
          manifest-path: pixi.toml

      - name: Show Pixi version
        run: pixi --version

      - name: Run packaging tests
        run: pixi run test-packaging

      - name: Build standalone bundles
        env:
          PBS_PYTHON_VERSION: ${{ github.event.inputs.python-version || '3.12' }}
          PBS_ARCHITECTURE: ${{ github.event.inputs.architecture }}
        run: pixi run build-standalone

      - name: Verify CLI bundle
        run: |
          file ./packaging/dist/uqcme-cli-standalone/python/bin/python3
          ./packaging/dist/uqcme-cli-standalone/python/bin/python3 -c "import platform, sys; print(platform.system(), platform.machine(), sys.version)"
          ./packaging/dist/uqcme-cli-standalone/uqcme --help

      - name: Verify dashboard bundle launchers
        run: |
          file ./packaging/dist/uqcme-dashboard-standalone/python/bin/python3
          ./packaging/dist/uqcme-dashboard-standalone/python/bin/python3 -c "import platform, sys; print(platform.system(), platform.machine(), sys.version)"
          ./packaging/dist/uqcme-dashboard-standalone/uqcme --help
          ./packaging/dist/uqcme-dashboard-standalone/uqcme-dashboard --help
          ./packaging/dist/uqcme-dashboard-standalone/uqcme-dashboard-smoke --help

      - name: Prepare release assets
        run: |
          cp packaging/dist/uqcme-cli-standalone.tar.gz packaging/dist/uqcme-cli-standalone-linux-x86_64.tar.gz
          cp packaging/dist/uqcme-dashboard-standalone.tar.gz packaging/dist/uqcme-dashboard-standalone-linux-x86_64.tar.gz

      - name: Upload CLI standalone bundle
        uses: actions/upload-artifact@v4
        with:
          name: uqcme-cli-standalone-linux-x86_64
          path: packaging/dist/uqcme-cli-standalone-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Upload dashboard standalone bundle
        uses: actions/upload-artifact@v4
        with:
          name: uqcme-dashboard-standalone-linux-x86_64
          path: packaging/dist/uqcme-dashboard-standalone-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Publish standalone bundles to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "uQCme $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" packaging/dist/uqcme-cli-standalone-linux-x86_64.tar.gz --clobber
          gh release upload "$GITHUB_REF_NAME" packaging/dist/uqcme-dashboard-standalone-linux-x86_64.tar.gz --clobber
