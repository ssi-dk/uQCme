title: "uQCme - Microbial QC Reporter"
version: "0.9.2"

app:
  server:
    host: "127.0.0.1"
    port: 8501
  input:
    data:
      file: ""
      api_call: "http://127.0.0.1:8000/api/v1/uQCme?project_id=uSymph"
      api_bearer_token_env: "UQCME_API_TOKEN"
      api_query_params:
        - batchIDs
        - seqSamples
        - analysisTypeID
    mapping: "./input/example/mapping.yaml"
    qc_rules: "./input/example/QC_rules.tsv"
    qc_tests: "./input/example/QC_tests.tsv"
  dashboard:
    categorical_filter_threshold: 20
    max_displayed_rules: 10
    table_height: 3600
  ui_styling:
  priority_colors:
    1: "#90EE90"
    2: "#FFFFE0"
    3: "#F08080"
    4: "#FFB6C1"

log:
  file: "./log/log-api-test.tsv"
