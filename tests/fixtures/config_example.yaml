title: "uQCme - Microbial QC Reporter"
version: "0.9.2"

qc:
  input:
    data: "./tests/data/example_run_data.tsv"
    mapping: "./tests/data/mapping.yaml"
    qc_rules: "./tests/data/QC_rules.tsv"
    qc_tests: "./tests/data/QC_tests.tsv"
  output:
    results: "./tests/uQCme_example_run_data.tsv"

app:
  server:
    host: "127.0.0.1"
    port: 3838
  input:
    data: "./tests/uQCme_example_run_data.tsv"
    mapping: "./tests/data/mapping.yaml"
    qc_rules: "./tests/data/QC_rules.tsv"
    qc_tests: "./tests/data/QC_tests.tsv"
  ui_styling:
    unsupported_species_color_light: "#1D4ED8"
    unsupported_species_color_dark: "#60A5FA"
    missing_species_color: "#808080"
    missing_species_opacity: 0.15
  priority_colors:
    1: "#90EE90"
    2: "#FFFFE0"
    3: "#F08080"
    4: "#FFB6C1"

log:
  file: "./log/log.tsv"
