title: "uQCme - New Schema Synthetic Example"
version: "0.9.2"

qc:
  input:
    data:
      file: "./input/example/run_data_new_schema.tsv"
    mapping: "./input/example/mapping.yaml"
    qc_rules: "./input/example/QC_rules.tsv"
    qc_tests: "./input/example/QC_tests.tsv"
  output:
    results: "./tests/fixtures/new_schema_example_run_data.tsv"
    warnings: "./output/example/new_schema_rule_warnings.tsv"

app:
  server:
    host: "127.0.0.1"
    port: 3839
  input:
    data:
      file: "./tests/fixtures/new_schema_example_run_data.tsv"
    mapping: "./input/example/mapping.yaml"
    qc_rules: "./input/example/QC_rules.tsv"
    qc_tests: "./input/example/QC_tests.tsv"
    warnings: "./output/example/new_schema_rule_warnings.tsv"
  dashboard:
    categorical_filter_threshold: 20
    max_displayed_rules: 10
    table_height: 3600
  ui_styling:
    unsupported_species_color_light: "#1D4ED8"
    unsupported_species_color_dark: "#60A5FA"
    missing_species_color: "#808080"
    missing_species_opacity: 0.15
  priority_colors:
    1: "#90EE90"
    2: "#FFFFE0"
    3: "#F08080"
    4: "#FFB6C1"

log:
  file: "./log/new_schema_example.log"
